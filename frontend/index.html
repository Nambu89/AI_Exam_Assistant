<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Exam Assistant — an open-source study companion powered by Microsoft Agent Framework, Azure AI Foundry and GraphRAG."
    />
    <meta name="color-scheme" content="light dark" />
    <title>AI Exam Assistant</title>
    <script>
      // Apply the persisted / system theme before paint to avoid a flash.
      (() => {
        try {
          const stored = localStorage.getItem("aiea-theme");
          const dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
