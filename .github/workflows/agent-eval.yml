name: Agent Evaluation Gate

# Quality GATE for the multi-agent app. Runs the evaluation harness against a
# gold Q&A set and FAILS the PR if quality thresholds are not met.
#
# Auth is passwordless: OIDC federated credentials (no static Azure secrets).
# Configure these GitHub *variables* (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID         - app registration / user-assigned MI with a federated
#                             credential for this repo, granted "Azure AI User" on Foundry
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   FOUNDRY_PROJECT_ENDPOINT - https://<resource>.services.ai.azure.com/api/projects/<project>
#   AZURE_SEARCH_ENDPOINT
# (These are set automatically as azd env outputs, or via `azd pipeline config`.)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

# Required for OIDC token issuance.
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  evaluate:
    name: Run agent evaluation harness
    runs-on: ubuntu-latest
    environment: evaluation # optional: gate on a protected environment
    env:
      MODEL_PROVIDER: foundry
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      JUDGE_MODEL: gpt-5-mini
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Install with the `eval` extra (azure-ai-evaluation / azure-ai-projects).
      - name: Install backend (with eval extras)
        run: python -m pip install --upgrade pip && pip install -e "./backend[eval]"

      # Passwordless Azure login via OIDC — no client secret stored anywhere.
      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The harness invokes the agent graph against the gold set and writes a JSON
      # report. It exits NON-ZERO when quality thresholds are not met -> the gate fails.
      #
      # `--mode azure` adds Microsoft's LLM-judge evaluators (Groundedness,
      # Relevance, Intent Resolution) as the authoritative quality view for the
      # cloud path. The deterministic lexical thresholds gate the exit code; they
      # are set for LLM (paraphrased) answers here — token-overlap groundedness is
      # naturally lower than the extractive offline path, while source citation
      # (`has_sources`) stays the strong deterministic signal. The strict offline
      # gate runs separately in ci.yml.
      - name: Run evaluation
        run: |
          python backend/evals/run_eval.py \
            --gold data/eval/gold_qa.jsonl \
            --out eval-report.json \
            --mode azure \
            --min-groundedness 0.35 \
            --min-pass-rate 0.6

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Agent Evaluation Report"
            echo ""
            if [ -f eval-report.json ]; then
              echo '```json'
              cat eval-report.json
              echo '```'
            else
              echo "> No report produced — the harness failed before writing output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ALTERNATIVE: Microsoft-native evaluation with the official GitHub Action.
  # Instead of the custom harness above, you can let Microsoft's action invoke
  # your deployed Foundry agent(s) and run its built-in evaluators (groundedness,
  # relevance, coherence, content safety, plus statistical A/B comparison).
  # Uncomment and set the placeholders to use it.
  # ---------------------------------------------------------------------------
  #
  # microsoft-native-eval:
  #   name: Microsoft AI Agent Evals (official)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Azure login (OIDC)
  #       uses: azure/login@v2
  #       with:
  #         client-id: ${{ vars.AZURE_CLIENT_ID }}
  #         tenant-id: ${{ vars.AZURE_TENANT_ID }}
  #         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  #     - name: Run Microsoft AI Agent Evaluation
  #       uses: microsoft/ai-agent-evals@v3-beta
  #       with:
  #         azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
  #         deployment-name: gpt-5-mini            # judge deployment
  #         agent-ids: "exam-tutor:1"              # <agent-name>:<version> to evaluate
  #         data-path: data/eval/agent_eval.jsonl  # queries + evaluators
  #         # baseline-agent-id: "exam-tutor:0"    # optional A/B baseline
